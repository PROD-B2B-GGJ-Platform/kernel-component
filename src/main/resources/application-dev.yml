spring:
  # PostgreSQL Database for Development (using Docker PostgreSQL)
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gograbjob_b2b}
    username: ${DATABASE_USERNAME:gograbjob}
    password: ${DATABASE_PASSWORD:gograbjob_dev_password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate  # Use validate mode with PostgreSQL (schema exists via Flyway)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  
  # Flyway (enabled for PostgreSQL dev mode - schema managed by migrations)
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  
  # Redis (disabled in dev)
  data:
    redis:
      enabled: false
      host: localhost
      port: 6379
  
  # Kafka (disabled in dev)
  kafka:
    enabled: false
    bootstrap-servers: localhost:9092

# Logging (more verbose in dev)
logging:
  level:
    root: INFO
    com.platform.kernel: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    io.github.resilience4j: DEBUG

# Disable Circuit Breaker in Dev (for easier debugging)
resilience4j:
  circuitbreaker:
    instances:
      redis:
        failure-rate-threshold: 100
      kafka:
        failure-rate-threshold: 100
      metadata:
        failure-rate-threshold: 100

# Development-specific settings
kernel:
  cache:
    ttl-minutes: 10  # Shorter TTL for dev
  
  events:
    outbox:
      poll-interval-ms: 2000  # Faster polling in dev
  
  metadata:
    sync:
      refresh-interval-minutes: 5  # Frequent refresh in dev

# CORS (allow all in dev)
spring.web.cors:
  allowed-origins: "*"
  allowed-methods: "*"
  allowed-headers: "*"

